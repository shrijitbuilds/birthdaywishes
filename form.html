<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wishes Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-page">
        <div class="form-card">
            <p class="eyebrow">A little birthday note</p>
            <h1>Send Birthday Wishes 💌</h1>

            <form id="birthdayForm" onsubmit="showMessage(); return false;">
                <div class="field-row">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="field-row">
                    <label for="relation">Birthday person is your</label>
                    <select id="relation" name="relation" required>
                        <option value="Best Friend">Best Friend</option>
                        <option value="Husband">Husband</option>
                        <option value="Wife">Wife</option>
                        <option value="Girlfriend">Girlfriend</option>
                        <option value="Grandfather">Grandfather</option>
                        <option value="Grandmother">Grandmother</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Uncle">Uncle</option>
                        <option value="Dad">Dad</option>
                        <option value="Mom">Mom</option>
                        <option value="Sister">Sister</option>
                        <option value="Partner">Partner</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="photoUpload">Upload Your Photo</label>
                    <input type="file" id="photoUpload" accept="image/*">
                </div>

                <div class="field-row">
                    <label for="message">Your Wishes</label>
                    <textarea id="message" rows="5" placeholder="Write a birthday message..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-btn">Send Wishes</button>
                    <button type="reset" class="secondary-btn small-btn">Clear</button>
                </div>
            </form>

            <div id="successMessage" class="success-message" aria-live="polite"></div>

            <a href="index.html" class="back-link">← Back to the birthday page</a>
        </div>
    </div>

    <script>
        const relationField = document.getElementById("relation");
        const savedRelation = localStorage.getItem("birthday_relation");
        relationField.value = Array.from(relationField.options).some(option => option.value === savedRelation)
            ? savedRelation
            : "Husband";

        relationField.addEventListener("change", function () {
            localStorage.setItem("birthday_relation", relationField.value);
        });

        function showMessage() {
            const name = document.getElementById("name").value.trim() || "Dear one";
            const relation = relationField.value;
            const customMessage = document.getElementById("message").value.trim();
            const photoInput = document.getElementById("photoUpload");

            localStorage.setItem("birthday_relation", relation);

            let note = customMessage;
            if (!note) {
                const defaultNotes = {
                    "Best Friend": "You are my favorite person to laugh with, trust, and celebrate life with. Happy birthday, best friend!",
                    "Husband": "Your love, strength, and kindness make every day brighter. Happy birthday, my dear husband!",
                    "Wife": "Your love, warmth, and kindness make every day brighter. Happy birthday, my dear wife!",
                    "Girlfriend": "Your joy and warmth make every day more beautiful. Happy birthday, my wonderful girlfriend!",
                    "Grandfather": "Your wisdom and stories mean so much to our family. Happy birthday, dear grandfather!",
                    "Grandmother": "Your warmth and kindness mean so much to our family. Happy birthday, dear grandmother!",
                    "Teacher": "Thank you for your patience, wisdom, and encouragement. Wishing you a wonderful birthday!",
                    "Uncle": "Your humor and generosity make every family gathering brighter. Happy birthday, dear uncle!",
                    "Dad": "Thank you for your strength, wisdom, and love. Happy birthday, Dad!",
                    "Mom": "Thank you for your care, warmth, and endless love. Happy birthday, Mom!",
                    "Sister": "Your laughter and support make life so much brighter. Happy birthday, dear sister!",
                    "Partner": "Every day with you is full of love and joy. Happy birthday, my love!"
                };
                note = defaultNotes[relation];
            }

            if (photoInput && photoInput.files && photoInput.files[0]) {
                const fileReader = new FileReader();
                fileReader.onload = function (event) {
                    const imageUrl = event.target.result;
                    const localStorageKey = "birthday_uploaded_photo";
                    localStorage.setItem(localStorageKey, imageUrl);
                    window.dispatchEvent(new CustomEvent('photoUpdated', { detail: imageUrl }));

                    document.getElementById("successMessage").innerHTML =
                        `🎉 Thank you, ${name}! Your birthday wishes as ${relation} were sent with love.<br>${note}<br><img src="${imageUrl}" alt="Uploaded birthday photo" style="max-width: 220px; border-radius: 16px; margin-top: 12px;">`;
                };
                fileReader.readAsDataURL(photoInput.files[0]);
                return;
            }

            document.getElementById("successMessage").innerHTML =
                `🎉 Thank you, ${name}! Your birthday wishes as ${relation} were sent with love.<br>${note}`;
        }
    </script>
</body>

</html>
